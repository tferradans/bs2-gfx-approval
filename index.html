<title>BS2 — Graphics Approval</title>
<style>
  :root{
    --bg:#14151a; --panel:#1c1d24; --line:#33343d; --ink:#e8e8ee; --dim:#8a8b96;
    --phone:#7fe0a8; --phone-bg:#1f3a2e; --desk:#8fb4ff; --desk-bg:#26304a;
    --accent:#6ea8ff;
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,sans-serif;margin:0}

  /* ── gate ── */
  #gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;
        flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
  /* MUST follow the rule above. An author-level `display:flex` beats the UA
     stylesheet's `[hidden]{display:none}`, so without this the gate stays
     painted forever after a correct code — the app renders BEHIND it and the
     only visible symptom is a scrollbar on a page you cannot reach. Same
     reason #lb needs its own [hidden] rule. */
  #gate[hidden]{display:none}
  #app[hidden]{display:none}
  #gate h1{font-size:19px;margin:0}
  #gate p{color:var(--dim);margin:0;text-align:center;max-width:34em}
  #gate form{display:flex;gap:8px;margin-top:6px}
  #gate input{background:var(--panel);border:1px solid var(--line);color:var(--ink);
              border-radius:8px;padding:11px 13px;font:15px/1 ui-monospace,monospace;
              letter-spacing:1px;width:15em}
  #gate button{background:var(--accent);border:0;color:#0d1524;font-weight:600;
               border-radius:8px;padding:11px 18px;cursor:pointer;font-size:14px}
  #gate .err{color:#ff8f8f;min-height:1.2em}
  #gate .stale{color:#ffce7a}

  /* ── chrome ── */
  header{position:sticky;top:0;z-index:20;background:rgba(20,21,26,.96);
         backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 20px 12px}
  .bar{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1.t{font-size:16px;margin:0}
  .stamp{color:var(--dim);font-size:12px}
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-top:11px;align-items:flex-end}
  .f{display:flex;flex-direction:column;gap:4px}
  .f label{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim)}
  select,input[type=text],input[type=number]{background:var(--panel);color:var(--ink);
    border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:13px system-ui,sans-serif;min-width:9em}
  input[type=number]{min-width:6.5em}
  .f-reset{background:none;border:1px solid var(--line);color:var(--dim);border-radius:7px;
           padding:7px 12px;cursor:pointer;font-size:13px}
  .f-reset:hover{color:var(--ink);border-color:var(--dim)}
  .count{color:var(--dim);font-size:12.5px;margin-top:9px}
  .count b{color:var(--ink);font-weight:600}

  /* ── grid ── */
  main{padding:20px 20px 60px}
  section h2{font-size:16px;border-bottom:1px solid var(--line);padding-bottom:6px;margin:26px 0 14px}
  .scene{margin-bottom:20px}
  .scene h3{font-size:13.5px;margin:0 0 8px;color:#c9cad4;display:flex;align-items:center;
            gap:9px;flex-wrap:wrap}
  .scene h3 .lbl{color:var(--dim);font-weight:400}
  .sys{font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:6px}
  .sys-phone{background:var(--phone-bg);color:var(--phone)}
  .sys-desktop{background:var(--desk-bg);color:var(--desk)}
  .sys-pending{background:#4a3520;color:#ffc37a}
  .scene.is-pending{border-left:3px solid #c98a3c;padding-left:13px;margin-left:-16px}
  p.pending{margin:0 0 9px;color:#ffc37a;font-size:12.5px;max-width:80ch}
  #lb-w{color:#ffc37a;font-size:13px;max-width:80vw;text-align:center;
        background:rgba(74,53,32,.55);border:1px solid #6b4d26;
        border-radius:8px;padding:6px 13px}
  #lb-w[hidden]{display:none}
  .who{font-size:10.5px;color:var(--dim);border:1px solid var(--line);padding:1px 7px;border-radius:6px}
  .beats{display:flex;flex-wrap:wrap;gap:12px}
  figure{margin:0;width:220px}
  figure img{width:220px;height:auto;border-radius:8px;border:1px solid var(--line);
             display:block;cursor:zoom-in;background:var(--panel)}
  figcaption{color:var(--dim);font-size:11.5px;margin-top:4px;text-align:center;
             overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .empty{color:var(--dim);padding:40px 0;text-align:center}

  /* ── lightbox ── */
  #lb{position:fixed;inset:0;z-index:40;background:rgba(10,10,14,.94);display:flex;
      flex-direction:column;align-items:center;justify-content:center;gap:12px}
  #lb[hidden]{display:none}
  #lb-t{font-size:15px;max-width:84vw;text-align:center;overflow:hidden;
        text-overflow:ellipsis;white-space:nowrap}
  #lb-t span{color:var(--dim)}
  #lb-i{max-height:80vh;max-width:88vw;border-radius:10px;border:1px solid #44454f}
  #lb-c{color:var(--dim);font-size:12.5px}
  .nav{position:fixed;top:50%;transform:translateY(-50%);background:rgba(40,41,50,.65);
       color:var(--ink);border:1px solid #44454f;border-radius:50%;width:46px;height:46px;
       font-size:26px;line-height:1;cursor:pointer}
  .nav:hover{background:rgba(70,72,85,.85)}
  #lb-p{left:20px} #lb-n{right:20px}
  @media (max-width:640px){
    figure,figure img{width:calc(50vw - 26px)}
    .nav{width:38px;height:38px;font-size:20px}
  }
</style>
</head>

  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);

function utf8(str){
  if (typeof TextEncoder !== 'undefined') return new TextEncoder().encode(str);
  const s = unescape(encodeURIComponent(str)), a = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
  return a;
}

function sha256sync(str){
  const msg = utf8(str), l = msg.length;
  const blocks = Math.ceil((l + 9) / 64);
  const buf = new Uint8Array(blocks * 64);
  buf.set(msg); buf[l] = 0x80;
  const dv = new DataView(buf.buffer);
  const bits = l * 8;
  dv.setUint32(blocks*64 - 8, Math.floor(bits / 4294967296), false);
  dv.setUint32(blocks*64 - 4, bits >>> 0, false);
  const H = new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,
                             0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
  const w = new Uint32Array(64), rr = (v,n) => (v>>>n)|(v<<(32-n));
  for (let b = 0; b < blocks; b++){
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(b*64 + i*4, false);
    for (let i = 16; i < 64; i++){
      const x = w[i-15], y = w[i-2];
      const s0 = rr(x,7)^rr(x,18)^(x>>>3), s1 = rr(y,17)^rr(y,19)^(y>>>10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
    }
    let a=H[0],b2=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for (let i = 0; i < 64; i++){
      const t1 = (h + (rr(e,6)^rr(e,11)^rr(e,25)) + ((e&f)^(~e&g)) + K256[i] + w[i]) >>> 0;
      const t2 = ((rr(a,2)^rr(a,13)^rr(a,22)) + ((a&b2)^(a&c)^(b2&c))) >>> 0;
      h=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b2; b2=a; a=(t1+t2)>>>0;
    }
    H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b2)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;
  }
  return [...H].map(x => x.toString(16).padStart(8,'0')).join('');
}

async function sha256(s){
  try {
    if (crypto && crypto.subtle){
      const b = await crypto.subtle.digest('SHA-256', utf8(s));
      return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
    }
  } catch(_){ /* fall through */ }
  return sha256sync(s);
}
const expired = () => new Date() > new Date(GATE.expires);

function showApp(){
  $('#gate').hidden = true; $('#app').hidden = false;
  buildFilters(); readURL(); render();
}
function showGate(msg, stale){
  $('#gate').hidden = false;
  if (msg) { const e = $('#gate-err'); e.textContent = msg; e.className = stale ? 'err stale' : 'err'; }
}

$('#gate-form').addEventListener('submit', async e => {
  e.preventDefault();
  if (expired()) return showGate('That review link has expired — ask for a new code.', true);
  const v = $('#gate-in').value.trim();
  if (!v) return;
  // Never fail silently: an exception here used to reject the promise with no
  // message, so the button simply did nothing and the reviewer had nothing to
  // report but "it doesn't work".
  try {
    if (await sha256(v) === GATE.hash){
      try { localStorage.setItem(KEY, GATE.expires); } catch(_){}
      showApp();
    } else {
      $('#gate-err').textContent = 'Not a valid code.';
      $('#gate-in').select();
    }
  } catch (err) {
    $('#gate-err').textContent = 'Could not check the code (' +
      (err && err.message ? err.message : err) + ') — tell the playback desk.';
  }
});

/* ── Filters ─────────────────────────────────────────────────────────
   URL params mirror the engines' ?char=/?scene= convention:
     ?ep=209,210  ?char=jodi  ?scene=44  ?sys=phone
   Character accepts an id (jodi), a display name, or a partial. Device
   variants (jodi_tablet) match their base character too, so filtering by
   "jodi" returns her tablet scenes rather than silently hiding them. */
const F = {ep:'', char:'', scene:'', sys:''};

// Section headings: EP207 -> "Episode 207"; EP_misc -> "Misc" (no episode "_misc")
const epName = ep => /^EP\d+$/.test(ep) ? ep.replace(/^EP/, 'Episode ')
                                        : ep.replace(/^EP_?/, '').replace(/^./, c => c.toUpperCase());
// Dropdown options: the field's own label already says "Episode", so the
// number carries it alone — "209", not "Episode 209".
const epShort = ep => /^EP\d+$/.test(ep) ? ep.slice(2) : epName(ep);

function charLabel(cid){
  const c = DATA.chars[cid];
  if (!c) return cid;
  return c.device ? `${c.name}` : c.name;
}
function charMatches(sceneChar, q){
  if (!q) return true;
  const c = DATA.chars[sceneChar] || {name:sceneChar, base:sceneChar};
  const hay = [sceneChar, c.base, c.name, charLabel(sceneChar)].join(' ').toLowerCase();
  return hay.includes(q.toLowerCase());
}

function buildFilters(){
  const eps = [...new Set(DATA.scenes.map(s => s.ep))].sort();
  const sel = $('#f-ep');
  eps.forEach(e => sel.add(new Option(epShort(e), e)));
  const dl = $('#chars');
  [...new Set(DATA.scenes.map(s => s.char).filter(Boolean))]
    .sort((a,b) => charLabel(a).localeCompare(charLabel(b)))
    .forEach(cid => {
      const o = document.createElement('option');
      o.value = charLabel(cid);
      const c = DATA.chars[cid];
      o.label = c && c.device ? `${cid} (${c.device})` : cid;
      dl.appendChild(o);
    });
  $('#stamp').textContent = 'captured ' + DATA.generated;

  const bind = (id, key, ev) => $(id).addEventListener(ev || 'change', e => {
    F[key] = e.target.value.trim(); writeURL(); render();
  });
  bind('#f-ep','ep'); bind('#f-sys','sys');
  bind('#f-char','char','input'); bind('#f-scene','scene','input');
  $('#f-clear').addEventListener('click', () => {
    Object.keys(F).forEach(k => F[k]='');
    $('#f-ep').value=''; $('#f-char').value=''; $('#f-scene').value=''; $('#f-sys').value='';
    writeURL(); render();
  });
}

function readURL(){
  const q = new URLSearchParams(location.search);
  const ep = (q.get('ep')||q.get('episode')||'').trim();
  if (ep){ const first = ep.split(',')[0].trim().replace(/^EP/i,''); F.ep = 'EP'+first; }
  F.char = (q.get('char')||'').trim();
  F.scene = (q.get('scene')||'').trim().replace(/^s?\d*_/, '');
  const sys = (q.get('sys')||q.get('system')||'').toLowerCase();
  F.sys = ['phone','desktop'].includes(sys) ? sys : '';
  // multi-episode (?ep=209,210) is kept as a set the filter honours
  F.epSet = ep ? new Set(ep.split(',').map(x => 'EP'+x.trim().replace(/^EP/i,''))) : null;
  if (F.epSet && F.epSet.size > 1) F.ep = '';
  $('#f-ep').value = F.ep; $('#f-char').value = F.char;
  $('#f-scene').value = F.scene; $('#f-sys').value = F.sys;
}
function writeURL(){
  F.epSet = null;
  const q = new URLSearchParams();
  if (F.ep) q.set('ep', F.ep.replace(/^EP/,''));
  if (F.char) q.set('char', F.char);
  if (F.scene) q.set('scene', F.scene);
  if (F.sys) q.set('sys', F.sys);
  const s = q.toString();
  history.replaceState(null, '', s ? '?' + s : location.pathname);
}

function visible(){
  return DATA.scenes.filter(s => {
    if (F.epSet ? !F.epSet.has(s.ep) : (F.ep && s.ep !== F.ep)) return false;
    if (F.sys && s.sys !== F.sys) return false;
    if (F.scene !== '' && String(s.num) !== String(parseInt(F.scene,10))) return false;
    if (!charMatches(s.char, F.char)) return false;
    return true;
  });
}

/* ── Render ─────────────────────────────────────────────────────────── */
let FLAT = [];
function render(){
  const list = visible();
  FLAT = [];
  const byEp = new Map();
  list.forEach(s => { if(!byEp.has(s.ep)) byEp.set(s.ep, []); byEp.get(s.ep).push(s); });

  const shots = list.reduce((n,s) => n + s.beats.length, 0);
  $('#count').innerHTML = `<b>${list.length}</b> scene${list.length===1?'':'s'} · ` +
    `<b>${shots}</b> shot${shots===1?'':'s'}` +
    (list.length < DATA.scenes.length ? ` · ${DATA.scenes.length - list.length} hidden by filters` : '');

  const esc = t => String(t==null?'':t).replace(/[&<>"]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let html = '';
  for (const [ep, scenes] of [...byEp.entries()].sort()){
    html += `<section><h2>${esc(epName(ep))}</h2>`;
    for (const s of scenes){
      const who = s.char ? `<span class="who">${esc(charLabel(s.char))}</span>` : '';
      const flag = s.pending ? `<span class="sys sys-pending">art pending</span>` : '';
      html += `<div class="scene${s.pending?' is-pending':''}">` +
              `<h3><span class="sys sys-${s.sys}">${s.sys}</span>${flag}` +
              `${esc(s.id)}${who}${s.label?`<span class="lbl">${esc(s.label)}</span>`:''}</h3>` +
              (s.pending?`<p class="pending">${esc(s.pending)}</p>`:'') +
              `<div class="beats">`;
      for (const b of s.beats){
        const i = FLAT.length;
        FLAT.push({src:b.f, beat:b.n, pending:s.pending||'',
                   scene:s.id + (s.label?` — ${s.label}`:'')});
        html += `<figure><img loading="lazy" src="${esc(b.t)}" data-i="${i}" ` +
                `width="${b.w}" height="${b.h}" alt="${esc(s.id+' '+b.n)}">` +
                `<figcaption>${esc(b.n)}</figcaption></figure>`;
      }
      html += `</div></div>`;
    }
    html += `</section>`;
  }
  $('#grid').innerHTML = html || `<div class="empty">No scenes match these filters.</div>`;
}

/* ── Lightbox ───────────────────────────────────────────────────────── */
let LB = -1;
function openLB(i){
  LB = (i + FLAT.length) % FLAT.length;
  const s = FLAT[LB];
  $('#lb-i').src = s.src;
  $('#lb-t').innerHTML = `${s.scene.replace(/[&<>]/g,'')} <span>· ${s.beat}</span>`;
  $('#lb-w').textContent = s.pending || '';
  $('#lb-w').hidden = !s.pending;
  $('#lb-c').textContent = `${LB+1} / ${FLAT.length}`;
  $('#lb').hidden = false;
}
$('#grid').addEventListener('click', e => {
  const img = e.target.closest('img[data-i]');
  if (img) openLB(+img.dataset.i);
});
$('#lb-p').addEventListener('click', e => { e.stopPropagation(); openLB(LB-1); });
$('#lb-n').addEventListener('click', e => { e.stopPropagation(); openLB(LB+1); });
$('#lb').addEventListener('click', e => { if (e.target.id === 'lb') $('#lb').hidden = true; });
addEventListener('keydown', e => {
  if ($('#lb').hidden) return;
  if (e.key === 'Escape') $('#lb').hidden = true;
  else if (e.key === 'ArrowLeft') openLB(LB-1);
  else if (e.key === 'ArrowRight') openLB(LB+1);
});

/* ── Boot ────────────────────────────────────────────────────────────
   LAST on purpose. A remembered code sends this straight into showApp(),
   which reads `const F` and the render helpers below — declared later in
   the file, so booting from the top hits their temporal dead zone. That
   only bites on a RETURN visit (a first visit stops at the gate and never
   touches them), which makes it look like a caching bug rather than an
   ordering one. Keep this block at the bottom. */
(function boot(){
  if (!crypto.subtle){            // non-secure context (plain http / some file://)
    return showGate('This page needs a secure (https) connection to check the code.');
  }
  let ok = false;
  try { ok = localStorage.getItem(KEY) === GATE.expires; } catch(_){}
  if (expired()){
    showGate('This review link expired on ' + GATE.expires.slice(0,10) +
             '. Ask for a new code.', true);
    $('#gate-form').hidden = true;
  } else if (ok) { showApp(); }
  else { showGate(''); $('#gate-in').focus(); }
})();
</script>
</body>
